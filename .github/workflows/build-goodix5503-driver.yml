name: Build Goodix 5503 production driver

on:
  pull_request:
    paths:
      - ".github/workflows/build-goodix5503-driver.yml"
      - "libfprint/**"
      - "scripts/build-libfprint-driver.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile pinned libfprint overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PINNED_LIBFPRINT_REVISION: 80a4b5ec612892c5c056c48dddaa561452cf37ec
      LIBFPRINT_URL: https://gitlab.freedesktop.org/libfprint/libfprint.git

    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build-only dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            ca-certificates \
            git \
            libglib2.0-dev \
            libgusb-dev \
            libopencv-dev \
            libssl-dev \
            meson \
            ninja-build \
            pkg-config
          dpkg-query --showformat='${Package} ${Version}\n' --show \
            build-essential ca-certificates git libglib2.0-dev libgusb-dev \
            libopencv-dev libssl-dev meson ninja-build pkg-config

      - name: Fetch and verify pinned libfprint
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/libfprint-source
        run: |
          set -euxo pipefail
          git init --initial-branch=upstream "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" remote add origin "$LIBFPRINT_URL"
          git -C "$UPSTREAM_DIR" fetch --depth=1 origin "$PINNED_LIBFPRINT_REVISION"
          git -C "$UPSTREAM_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$UPSTREAM_DIR" rev-parse HEAD)" = "$PINNED_LIBFPRINT_REVISION"
          test -z "$(git -C "$UPSTREAM_DIR" status --porcelain=v1)"

      - name: Compile the production driver only
        env:
          LIBFPRINT_SOURCE: ${{ runner.temp }}/libfprint-source
        run: |
          set -euxo pipefail
          bash scripts/build-libfprint-driver.sh --build-only
